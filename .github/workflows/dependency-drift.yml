name: Dependency drift

# Check dependency ranges independently of the locked build. This also runs
# weekly because dependency releases can break compatibility between pushes.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-drift-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fresh-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Resolve the newest versions Cargo.toml allows
        # Prints each package that moved, so a failure names its suspects.
        run: cargo update
      - name: Check against the fresh resolution
        run: cargo check --all-targets
