name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv
      - name: Validate devenv and generated hooks
        run: devenv test
      - name: Run the complete check task
        shell: devenv shell -- bash -e {0}
        run: lific-check

  windows:
    # Native Windows/MSVC remains outside devenv until its platform toolchain
    # path is defined and validated.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Ensure web/dist exists for rust-embed
        run: mkdir -p web/dist
        shell: bash

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv
      - name: Run the browser task graph
        shell: bash
        run: devenv --profile e2e tasks run lific:e2e
      - name: Retain native-link browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-link-traces
          path: /tmp/lific-native-links-*/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv
      - name: Build and check documentation
        shell: devenv shell -- bash -e {0}
        run: lific-docs-check
