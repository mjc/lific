name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Cache the Devenv toolchain
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Reuse tools across source edits, never cached task-success state.
          # Nix validates store paths when falling back to an older environment.
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-base-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-base-
          paths: ~/.cache/nix
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/$(jq -r '.nodes.devenv.locked.rev' devenv.lock)#devenv"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cmd-format: devenv shell -- {0}
          prefix-key: devenv-${{ hashFiles('devenv.lock') }}
          shared-key: linux-debug-check
          cache-workspace-crates: true
      - name: Run project, hook, and documentation checks
        run: devenv tasks run lific:check devenv:git-hooks:run lific:docs:check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Cache the Devenv browser toolchain
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-e2e-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-e2e-
            nix-${{ runner.os }}-${{ runner.arch }}-base-
          paths: ~/.cache/nix
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/$(jq -r '.nodes.devenv.locked.rev' devenv.lock)#devenv"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cmd-format: devenv --profile e2e shell -- {0}
          prefix-key: devenv-${{ hashFiles('devenv.lock') }}
          shared-key: linux-debug-check
          cache-workspace-crates: true
          # check writes the superset after Rust tests, Clippy, and hooks.
          save-if: false
      - name: Run the browser task graph
        run: devenv --profile e2e tasks run lific:e2e
      - name: Retain native-link browser traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-link-traces
          path: /tmp/lific-native-links-*/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  windows:
    # Keep native Windows compilation, Clippy, and tests as a CI gate while
    # the release workflow transitions to a dedicated MSVC build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Ensure web/dist exists for rust-embed
        run: mkdir -p web/dist
        shell: bash

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets
