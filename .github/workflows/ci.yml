name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/$(jq -r '.nodes.devenv.locked.rev' devenv.lock)#devenv"
      - name: Build and smoke-test the packaged release
        shell: bash
        run: |
          package_path="$(devenv build outputs.lific | jq -r '."outputs.lific"')"
          devenv shell -- bash scripts/verify-release-binary.sh "$package_path/bin/lific"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/$(jq -r '.nodes.devenv.locked.rev' devenv.lock)#devenv"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cmd-format: devenv shell -- {0}
          prefix-key: devenv-${{ hashFiles('devenv.lock') }}
          shared-key: linux-debug
      - name: Run the Devenv project test graph
        run: devenv test

  windows:
    # Keep native Windows compilation, Clippy, and tests as a CI gate while
    # the release workflow transitions to a dedicated MSVC build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Ensure web/dist exists for rust-embed
        run: mkdir -p web/dist
        shell: bash

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  windows-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/$(jq -r '.nodes.devenv.locked.rev' devenv.lock)#devenv"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cmd-format: devenv --profile release-windows shell -- {0}
          prefix-key: devenv-${{ hashFiles('devenv.lock') }}
          shared-key: release-x86_64-pc-windows-gnu
      - name: Cross-build the Windows release with devenv
        shell: bash
        run: devenv --profile release-windows tasks run lific:release:x86_64-pc-windows-gnu
      - name: Verify Windows artifact structure
        shell: bash
        run: devenv --profile release-windows shell -- bash -euo pipefail -c "file target/x86_64-pc-windows-gnu/dist/lific.exe | grep -q 'PE32+'"

  windows-msvc-cross-build:
    # This is the proposed release path: Linux owns the reproducible Devenv
    # build, while Windows executes the exact uploaded bytes below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/$(jq -r '.nodes.devenv.locked.rev' devenv.lock)#devenv"
      - name: Build the MSVC release with devenv
        shell: bash
        run: devenv --profile release-windows-msvc tasks run lific:release:x86_64-pc-windows-msvc
      - name: Verify Windows artifact structure
        shell: bash
        run: |
          devenv --profile release-windows-msvc shell -- bash -euo pipefail -c \
            "file target/x86_64-pc-windows-msvc/dist/lific.exe | grep -q 'PE32+'"
          cp target/x86_64-pc-windows-msvc/dist/lific.exe lific-windows-msvc-x86_64.exe
          sha256sum lific-windows-msvc-x86_64.exe > lific-windows-msvc-x86_64.exe.sha256
      - name: Upload the exact executable for native Windows verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msvc-cross
          path: |
            lific-windows-msvc-x86_64.exe
            lific-windows-msvc-x86_64.exe.sha256
          retention-days: 7

  windows-msvc-cross-test:
    needs: windows-msvc-cross-build
    runs-on: windows-latest
    steps:
      # Deliberately do not check out or rebuild the source: this job executes
      # the exact artifact produced by the Linux Devenv job.
      - name: Download the Devenv-built executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-msvc-cross
      - name: Verify and smoke-test the exact artifact
        shell: pwsh
        run: |
          $binary = (Resolve-Path .\lific-windows-msvc-x86_64.exe).Path
          $expected = (Get-Content .\lific-windows-msvc-x86_64.exe.sha256).Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "MSVC artifact checksum mismatch: expected $expected, got $actual"
          }

          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "lific --version failed" }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "lific --help failed" }

          $port = 3456
          $db = Join-Path $PWD "lific-ci.db"
          $env:LIFIC_INIT_ADMIN_NAME = "CI"
          $env:LIFIC_INIT_ADMIN_PASSWORD = "ci-release-password-123"
          $server = Start-Process -FilePath $binary `
            -ArgumentList @("--db", $db, "start", "--init-if-missing", "--host", "127.0.0.1", "--port", $port) `
            -PassThru -RedirectStandardOutput .\lific-server.out -RedirectStandardError .\lific-server.err
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($server.HasExited) {
                throw "lific exited with code $($server.ExitCode)`n$(Get-Content .\lific-server.err -Raw)"
              }
              try {
                $health = Invoke-WebRequest "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                if ($health.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "lific did not become healthy`n$(Get-Content .\lific-server.err -Raw)" }

            & $binary --db $db doctor --repair | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "lific database doctor failed" }
            if (-not (Test-Path $db)) { throw "lific did not create its database" }

            $page = Invoke-WebRequest "http://127.0.0.1:$port/" -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "<html") {
              throw "embedded web UI did not respond with HTML"
            }
            $asset = [regex]::Match($page.Content, '(?:src|href)="([^"]+/assets/[^"]+)"').Groups[1].Value
            if (-not $asset) { throw "embedded web UI did not reference a static asset" }
            $assetResponse = Invoke-WebRequest "http://127.0.0.1:$port$asset" -TimeoutSec 5
            if ($assetResponse.StatusCode -ne 200) { throw "embedded web UI asset failed: $asset" }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

  macos:
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/$(jq -r '.nodes.devenv.locked.rev' devenv.lock)#devenv"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cmd-format: devenv --profile release-darwin shell -- {0}
          prefix-key: devenv-${{ hashFiles('devenv.lock') }}
          shared-key: release-${{ matrix.target }}
      - name: Build macOS release with devenv
        shell: bash
        run: devenv --profile release-darwin tasks run "lific:release:${{ matrix.target }}"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/$(jq -r '.nodes.devenv.locked.rev' devenv.lock)#devenv"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cmd-format: devenv --profile e2e shell -- {0}
          prefix-key: devenv-${{ hashFiles('devenv.lock') }}
          shared-key: linux-debug
      - name: Run the browser task graph
        run: devenv --profile e2e tasks run lific:e2e
      - name: Retain native-link browser traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-link-traces
          path: /tmp/lific-native-links-*/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/$(jq -r '.nodes.devenv.locked.rev' devenv.lock)#devenv"
      - name: Build and check documentation
        run: devenv --profile docs tasks run lific:docs:check
