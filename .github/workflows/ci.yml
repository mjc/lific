name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Ensure web/dist exists for rust-embed
        run: mkdir -p web/dist

      - name: Clippy
        # --all-targets covers tests + binaries + examples so lint regressions
        # in test code (e.g. clippy::await_holding_lock) get caught here too.
        # -D warnings keeps the bar high; if a future Rust release adds noisy
        # style lints, allow them per-lint in code rather than weakening CI.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  nix:
    name: Nix (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64-linux flake check
            os: ubuntu-latest
            check: true
          - label: aarch64-linux package
            os: ubuntu-24.04-arm
            check: false
          - label: aarch64-darwin package
            os: macos-14
            check: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Check flake and NixOS VM test
        if: matrix.check
        run: nix flake check --print-build-logs
      - name: Build native package
        if: ${{ !matrix.check }}
        run: nix build .#lific --print-build-logs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag lific:ci .
      - name: Start with a bind-mounted private config
        run: |
          mkdir -p data
          printf '[auth]\nrequired = true\n' > data/lific.toml
          sudo chown -R 65532:65532 data
          sudo chmod 0750 data
          sudo chmod 0600 data/lific.toml
          docker run --detach --name lific-ci --publish 3456:3456 --volume "$PWD/data:/data" lific:ci
          trap 'docker logs lific-ci; docker rm --force lific-ci' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:3456/api/health

  windows:
    # Windows ships a release binary, so it gets the same gate as Linux rather
    # than a compile-only smoke check. Nothing verified the platform at all
    # until v2.4.0 turned out not to compile there: `src/cli/service.rs` called
    # the unix-only `libc::getuid()` with no cfg guard, and the release matrix
    # built only Linux and macOS, so no job would ever have noticed (GitHub
    # #20). A `cargo check` would have caught that one bug and nothing about
    # runtime behavior, which is the more interesting half on a platform none
    # of the maintainers develop on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Ensure web/dist exists for rust-embed
        run: mkdir -p web/dist
        shell: bash

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  web:
    # The frontend used to ship completely unverified: ci.yml only ran
    # `mkdir -p web/dist` so rust-embed would compile, and nothing ever
    # typechecked or built web/. That is how v2.7.0 released with every issue
    # page broken (LIF-428/LIF-429). This job catches type and template
    # errors; the `smoke` job below catches runtime-only breakage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Typecheck (svelte-check + tsc)
        run: bun run check
        working-directory: web
      - name: Build
        run: bun run build
        working-directory: web

  smoke:
    # svelte-check reported 0 errors on the code that shipped v2.7.0 with
    # every issue page broken — the crash was a runtime reactive-effect loop,
    # so only running the app catches that class of bug. e2e/smoke.ts spawns
    # the real binary on a scratch DB, seeds data through the CLI, signs in
    # through the real login page, and drives headless Chromium through the
    # main routes, failing on the error-boundary fallback, console errors,
    # uncaught exceptions, or missing seeded content (LIF-429). Its first
    # local run also caught LIF-431, a 403 on every direct-connection
    # realtime WebSocket handshake.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        run: bun install --frozen-lockfile && bun run build
        working-directory: web
      - name: Build binary
        # Debug on purpose: rust-embed serves web/dist from disk in debug
        # builds, so the freshly built frontend is exercised without paying
        # for a release compile. Release embedding is covered by release.yml.
        run: cargo build
      - name: Install e2e dependencies and browser
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium
        working-directory: e2e
      - name: Browser smoke test
        run: bun run smoke
        working-directory: e2e

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install documentation site dependencies
        run: bun install --frozen-lockfile
        working-directory: site
      - name: Build documentation site
        run: bun run build
        working-directory: site
      - name: Check documented surfaces and local links
        # The documentation PRs are intentionally independent slices. The
        # full parity check compares against the current release baseline and
        # therefore runs after those slices land on master; PRs still build
        # the site so MDX/TypeScript errors are caught before merge.
        if: github.event_name == 'push'
        run: bun scripts/check-docs.mjs
