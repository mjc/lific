name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv
      - name: Check formatting
        shell: bash
        run: devenv build outputs.treefmtCheck
      - name: Validate devenv and generated hooks
        shell: bash
        run: devenv test
      - name: Run the complete check task
        run: devenv tasks run lific:check

  windows:
    # Native Windows/MSVC remains outside devenv until its platform toolchain
    # path is defined and validated.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Ensure web/dist exists for rust-embed
        run: mkdir -p web/dist
        shell: bash

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  web:
    # The frontend used to ship completely unverified: ci.yml only ran
    # `mkdir -p web/dist` so rust-embed would compile, and nothing ever
    # typechecked or built web/. That is how v2.7.0 released with every issue
    # page broken (LIF-428/LIF-429). This job catches type and template
    # errors; the `smoke` job below catches runtime-only breakage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Typecheck (svelte-check + tsc)
        run: bun run check
        working-directory: web
      - name: Frontend unit tests
        run: bun test
        working-directory: web
      - name: Community proxy security tests
        run: bun test ./deploy/community-redirect/worker.test.mjs
      - name: Build
        run: bun run build
        working-directory: web

 
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv --profile e2e shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv
      - name: Run the browser task graph
        run: devenv tasks run lific:e2e
      - name: Retain native-link browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-link-traces
          path: /tmp/lific-native-links-*/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv --profile docs shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv
      - name: Build and check documentation
        run: devenv tasks run lific:docs:check
