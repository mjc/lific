[package]
name = "topcoat-runtime"
version = "0.10.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/tokio-rs/topcoat"
description = "A modular, batteries-included Rust web framework for server-rendered apps."

[features]
router = [
    "dep:futures-util",
    "dep:pin-project-lite",
    "dep:tokio",
    "dep:topcoat-router",
]

[dependencies]
topcoat-asset = { git = "https://github.com/mjc/topcoat", rev = "e2444306b237c9b771ec33f76f9ae891392a0554" }
topcoat-core = { git = "https://github.com/mjc/topcoat", rev = "e2444306b237c9b771ec33f76f9ae891392a0554" }
topcoat-router = { git = "https://github.com/mjc/topcoat", rev = "e2444306b237c9b771ec33f76f9ae891392a0554", optional = true }
topcoat-view = { git = "https://github.com/mjc/topcoat", rev = "e2444306b237c9b771ec33f76f9ae891392a0554" }
topcoat-view-macro = { git = "https://github.com/mjc/topcoat", rev = "e2444306b237c9b771ec33f76f9ae891392a0554" }

pin-project-lite = { version = "0.2", optional = true }
ref-cast = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
futures-util = { version = "0.3", optional = true, features = ["sink"] }
tokio = { version = "1.51.1", optional = true, features = ["rt", "sync", "time", "macros"] }
topcoat-router = { git = "https://github.com/mjc/topcoat", rev = "e2444306b237c9b771ec33f76f9ae891392a0554", optional = true, features = ["websocket"] }

[dev-dependencies]
tokio = { version = "1.51.1", features = ["rt-multi-thread"] }
topcoat = { git = "https://github.com/mjc/topcoat", rev = "e2444306b237c9b771ec33f76f9ae891392a0554", default-features = false, features = ["asset", "router", "view", "runtime"] }

[patch."https://github.com/mjc/topcoat"]
topcoat-runtime = { path = "." }
